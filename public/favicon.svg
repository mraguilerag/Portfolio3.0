<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a855ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7e14ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="budGrad" cx="24" cy="18" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="60%" stop-color="#a10f2c"/>
      <stop offset="100%" stop-color="#5c0a1c"/>
    </radialGradient>
    <radialGradient id="flapGrad" cx="31" cy="26" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9fb0"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#b3122e"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="24" y1="27" x2="12" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f8f57"/>
      <stop offset="100%" stop-color="#175c34"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="11" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3aa968"/>
      <stop offset="100%" stop-color="#1f7a4d"/>
    </linearGradient>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ambient brand glow to tie in with the site's purple aesthetic -->
  <circle cx="25" cy="17" r="17" fill="url(#glowPurple)" filter="url(#blurGlow)"/>

  <!-- stem -->
  <path fill="url(#stemGrad)" d="M23 27 C19 32 13 36 11.5 42 C11.2 43.3 12 44.7 13.2 44.9 C14.3 45 15 43.7 15.3 42.2 C16.5 36.5 21.5 32 26 28 Z"/>

  <!-- leaf -->
  <path fill="url(#leafGrad)" d="M0 0 C5 -2.5 10 -0.5 11 3.5 C10 7.5 5 9.5 0 7 C-1.2 4.5 -1.2 2.5 0 0 Z" transform="translate(9 35) rotate(-25)"/>

  <!-- rose bud base -->
  <path fill="url(#budGrad)" d="M24 6 C31 6 36 11 36 18 C36 24.5 30.5 29 24 29 C17.5 29 12 24.5 12 18 C12 11 17 6 24 6 Z"/>

  <!-- curling front petal flap (the classic rose-silhouette cue) -->
  <path fill="url(#flapGrad)" d="M27 22 C32.5 20.5 37.5 23.5 36.5 28.5 C35.5 33 30 34.5 26.5 31 C24 28.5 24 24.5 27 22 Z"/>

  <!-- top highlight sliver -->
  <path fill="#ffd6e0" opacity="0.85" d="M17 11 C19.5 8.5 23.5 8 26 9.5 C23 9 19.5 9.8 17.5 12.5 C17 12 16.7 11.4 17 11 Z"/>
</svg>
